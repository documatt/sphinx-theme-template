<!doctype html>
<html>
  <head>
    <title>{{ title|striptags|e }} &mdash; {{ docstitle|e }}</title>

    {%- for css in css_files %}
      {%- if css|attr("filename") %}
        {{ css_tag(css) }}
      {%- else %}
        <link rel="stylesheet" href="{{ pathto(css, 1)|e }}" type="text/css" />
      {%- endif %}
    {%- endfor %}
  </head>
  <body>
    {% block body %}{% endblock %}
  </body>
</html>
